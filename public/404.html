<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Flashcard Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #1a1d29;
        --muted: #5a6072;
        --primary: #4f46e5;
        --border: rgba(26, 29, 41, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;
          --surface: #171a23;
          --text: #e7e9f0;
          --muted: #9aa0b4;
          --primary: #818cf8;
          --border: rgba(148, 163, 184, 0.16);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100%, 460px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 12px 36px rgba(15, 17, 23, 0.12);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--primary);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 10px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Flashcard Studio</p>
      <h1>Page not found</h1>
      <p>The page you requested is not available. Return to the app and continue studying from the dashboard.</p>
      <a href="/">Back to Flashcard Studio</a>
    </main>
  </body>
</html>
